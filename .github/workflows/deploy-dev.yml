# 개발 환경 배포 — develop 브랜치 푸시 시 자동 실행
# Docker 이미지 빌드 → ACR 푸시 → Azure Container Apps 업데이트

name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 동시 배포 방지 (진행 중인 배포가 있으면 대기)
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Azure CLI 로그인
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ACR 로그인
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: grimoireacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Docker 이미지 빌드 및 푸시 (커밋 SHA + latest 태그)
      - name: Build and push Docker image
        run: |
          IMAGE=grimoireacr.azurecr.io/grimoire-server
          docker build --platform linux/amd64 \
            -t $IMAGE:dev-${{ github.sha }} \
            -t $IMAGE:dev-latest \
            .
          docker push $IMAGE:dev-${{ github.sha }}
          docker push $IMAGE:dev-latest

      # Azure Container Apps 업데이트
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name grimoire-server-dev \
            --resource-group zenith-rg \
            --image grimoireacr.azurecr.io/grimoire-server:dev-${{ github.sha }} \
            -o none
