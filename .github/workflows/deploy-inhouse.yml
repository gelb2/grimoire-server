# 인하우스 환경 배포 — inhouse 브랜치 푸시 시 자동 실행
# Docker 이미지 빌드 → ACR 푸시 → Azure Container Apps 업데이트

name: Deploy Inhouse

on:
  push:
    branches: [inhouse]
  workflow_dispatch:

# 동시 배포 방지
concurrency:
  group: deploy-inhouse
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Inhouse
    runs-on: ubuntu-latest
    environment: inhouse

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Azure CLI 로그인
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ACR 로그인
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: grimoireacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          IMAGE=grimoireacr.azurecr.io/grimoire-server
          docker build --platform linux/amd64 \
            -t $IMAGE:inhouse-${{ github.sha }} \
            -t $IMAGE:inhouse-latest \
            .
          docker push $IMAGE:inhouse-${{ github.sha }}
          docker push $IMAGE:inhouse-latest

      # Azure Container Apps 업데이트
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name grimoire-server-inhouse \
            --resource-group grimoire-rg \
            --image grimoireacr.azurecr.io/grimoire-server:inhouse-${{ github.sha }} \
            -o none
