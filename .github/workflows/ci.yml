# CI 파이프라인 — PR 시 빌드 + 테스트 + Docker 검증
# develop/inhouse/main 대상 PR에서 실행되며, 모든 체크 통과 필수

name: CI

on:
  pull_request:
    branches: [develop, inhouse, main]

# 동일 PR에 새 커밋이 푸시되면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 의존성 설치 (lock 파일 기준 정확한 버전)
      - name: Install dependencies
        run: npm ci

      # TypeScript 타입 체크 (컴파일 없이 타입만 검증)
      - name: TypeScript type check
        run: npx tsc --noEmit

      # 유닛 테스트 실행
      - name: Run tests
        run: npm test

      # NestJS 프로덕션 빌드
      - name: Build
        run: npm run build

      # Docker 이미지 빌드 검증 (푸시하지 않음)
      - name: Docker build check
        run: docker build -t grimoire-server-ci-check .
